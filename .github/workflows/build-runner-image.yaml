name: Build Runner Image

# Baut das eigene Runner-Image (runner-image/Dockerfile: upstream
# actions-runner + gettext-base fuer cosign-installer v4) und pusht es nach
# ghcr.io/sebastart/actions-runner. Public Repo -> Package public ->
# anonymer Pull aus dem Cluster, keine zusaetzlichen Secrets noetig
# (GITHUB_TOKEN mit packages:write reicht).
#
# Bewusst KEIN push-Trigger: das Image-Update ist ein manueller,
# kontrollierter Schritt (danach Digest in values/ pinnen +
# deploy-runners.yml dispatchen), gleiche Philosophie wie deploy-runners.yml.

concurrency:
  group: build-runner-image
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Public Repo -> GitHub-hosted arm64 ist frei; nativer Build statt QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 (node24 — GitHub forces node24 from 2026-06-16)

      - name: Login ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0 (node24 — GitHub forces node24 from 2026-06-16)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push
        id: build
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/sebastart/actions-runner"
          TAG="gettext-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          docker buildx build \
            --platform linux/arm64 \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            --push \
            --provenance=false \
            runner-image/
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "### Runner-Image gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest in values/base.yaml + values/production.yaml pinnen, dann deploy-runners.yml dispatchen." >> "$GITHUB_STEP_SUMMARY"
          echo "image=${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"

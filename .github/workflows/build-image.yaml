name: build-image (reusable, BuildKit)

# Reusable container build for the ARM64 self-hosted runners. Replaces the
# per-repo "kaniko pod + kubectl exec" pattern that was prone to exec-stream
# disconnects on multi-minute builds (the exec'd process dies with the stream).
#
# How this is robust:
#   - The build is the BuildKit POD's MAIN process (not an exec child). The CI
#     just creates the pod and POLLS its phase — a network blip retries a poll,
#     the build keeps running. No long-lived kubectl-exec stream.
#   - BuildKit (maintained; Kaniko was archived by Google 2025-06) builds the
#     repo via a GIT CONTEXT (clones itself in-cluster), so there is no
#     `tar | kubectl exec` source delivery either.
#   - Rootless/unprivileged (validated against the cluster admission policies):
#     runAsUser 1000 + seccomp/AppArmor Unconfined + --oci-worker-no-process-sandbox.
#   - Registry push-auth and the git clone token are delivered via a SHORT-LIVED
#     mounted Secret (created + deleted per run), not baked into the pod manifest.
#
# Background: cluster-baseline/node-hardening/etcd-dedicated-disk.md and the
# 2026-06-04 build-pipeline review.

on:
  workflow_call:
    inputs:
      image:
        description: "Target image repository, e.g. sebastart/wetrade"
        required: true
        type: string
      version:
        description: "Image tag to push, e.g. 1.0.287"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path relative to the repo root"
        required: false
        default: Dockerfile
        type: string
      build-args:
        description: "Space-separated KEY=VALUE build args (no spaces in values)"
        required: false
        default: ""
        type: string
      context-subdir:
        description: "Subdirectory of the repo to use as the build context root (empty = repo root). dockerfile is relative to this."
        required: false
        default: ""
        type: string
      target:
        description: "Multi-stage build target to build (empty = the Dockerfile's last stage). Maps to buildctl --opt target."
        required: false
        default: ""
        type: string
      digest-artifact-name:
        description: "If set, also upload the pushed image digest as an artifact of this name (file <name>.txt). For matrix callers, whose job outputs share one namespace and can't carry per-leg digests — the deploy job downloads digest-* and reads them."
        required: false
        default: ""
        type: string
      memory-request:
        description: "Build pod memory request. Keep low on memory-tight clusters — it only gates scheduling; the build can burst to memory-limit."
        required: false
        default: "768Mi"
        type: string
      memory-limit:
        description: "Build pod memory limit (hard ceiling; OOM-kills above this)."
        required: false
        default: "3Gi"
        type: string
      runner:
        description: "Self-hosted runner label"
        required: false
        default: production-arm64
        type: string
      k8s-api-server:
        description: "Kubernetes API server URL (caller passes vars.K8S_API_SERVER)"
        required: true
        type: string
      k8s-ca-data:
        description: "base64 cluster CA (caller passes vars.K8S_CA_DATA)"
        required: true
        type: string
      audience:
        description: "OIDC audience for the cluster"
        required: false
        default: "https://kubernetes.wetrade.cluster.local"
        type: string
    secrets:
      dockerhub-username:
        required: true
      dockerhub-token:
        required: true
      build-args-secret:
        # Additional space-separated KEY=VALUE build-args whose VALUES are
        # sensitive (e.g. come from a GitHub secret). Passed via secrets: so the
        # values are masked in logs — unlike the plain build-args input, which a
        # reusable-workflow caller cannot interpolate secrets into anyway. The
        # caller constructs the string in its secrets: block, e.g.
        #   build-args-secret: "FOO=${{ secrets.FOO }} BAR=${{ secrets.BAR }}"
        # NOTE: build-args are baked into the image; use this only for values
        # whose presence in the image is acceptable (public NEXT_PUBLIC_* keys),
        # not for true build-time secrets (those want BuildKit --secret instead).
        required: false
      gh-billing-token:
        # Bitwarden Secrets Manager machine-account ACCESS TOKEN (read-only on a
        # project holding only the billing PAT). select-runner fetches the actual
        # PAT from Bitwarden at runtime (bitwarden/sm-action), then reads this
        # month's Actions minutes and prefers GitHub-hosted arm64 (native,
        # off-cluster, free within the 2,000-min tier). The PAT lives ONLY in
        # Bitwarden (one place to rotate); GitHub Free can't share org secrets to
        # private repos, so this static BWS token sits per-repo. Absent / API error
        # => self-hosted in-cluster fallback, so builds never block.
        required: false
    outputs:
      digest:
        description: "sha256:... digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  # Pick GitHub-hosted arm64 when included Actions minutes remain (cheapest, native
  # ARM, and off the etcd-bearing k3s cluster); otherwise fall back to the
  # self-hosted runner + in-cluster BuildKit. Fail-safe by design: no token, API
  # error, or low minutes => self-hosted, so a build is never blocked.
  select-runner:
    runs-on: ubuntu-latest
    # Job-level env: the `secrets` context is NOT available in a step `if:`, but
    # `env` is — so map the token here to gate the Bitwarden fetch on its presence.
    env:
      BWS_TOKEN: ${{ secrets.gh-billing-token }}
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      # Fetch the billing PAT from Bitwarden using the machine-account access token
      # (passed as gh-billing-token). sm-action exports it as the masked env var
      # BILLING_TOKEN for the next step. Skipped if no token -> self-hosted.
      - name: Fetch billing token (Bitwarden)
        if: env.BWS_TOKEN != ''
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ env.BWS_TOKEN }}
          secrets: |
            f752cc65-9bed-48cd-8431-b46300521a3b > BILLING_TOKEN
      - id: pick
        env:
          ORG: ${{ github.repository_owner }}
          INCLUDED: "2000" # org plan's included Actions minutes/month
          BUFFER: "200" # switch to self-hosted once within this of the cap
          FALLBACK_RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          runner="$FALLBACK_RUNNER"; mode=incluster
          if [ -n "${BILLING_TOKEN:-}" ]; then
            # Enhanced billing usage report for the current month. Needs
            # Administration:read; the legacy settings/billing/actions endpoint is
            # gone (HTTP 410) for orgs on enhanced billing.
            Y=$(date -u +%Y); M=$(date -u +%-m)
            resp=$(curl -sfL \
              -H "Authorization: Bearer ${BILLING_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/organizations/${ORG}/settings/billing/usage?year=${Y}&month=${M}" || true)
            used=$(printf '%s' "$resp" | jq -r '
              [ .usageItems[]?
                | select((.product|ascii_downcase) == "actions")
                | select((.unitType|ascii_downcase) | test("minute"))
                | .quantity ] | add // empty' 2>/dev/null || true)
            if [ -n "$used" ]; then
              thresh=$(awk "BEGIN{print $INCLUDED-$BUFFER}")
              if awk "BEGIN{exit !($used < $thresh)}"; then
                runner=ubuntu-24.04-arm; mode=buildx
              fi
              printf 'Actions minutes used this month: %.0f / %s (buffer %s) -> %s (%s)\n' "$used" "$INCLUDED" "$BUFFER" "$runner" "$mode"
            else
              echo "Billing usage API returned no usable data; using self-hosted fallback (${runner})."
            fi
          else
            echo "No billing token (Bitwarden access token absent); using self-hosted (${runner})."
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    permissions:
      id-token: write
      contents: read
    outputs:
      # Coalesce: in-cluster path uses step id "run", buildx path uses "buildx".
      digest: ${{ steps.run.outputs.digest || steps.buildx.outputs.digest }}
    env:
      MODE: ${{ needs.select-runner.outputs.mode }}
      NS: actions-runner-system
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_ARGS: ${{ inputs.build-args }}
      CONTEXT_SUBDIR: ${{ inputs.context-subdir }}
      TARGET: ${{ inputs.target }}
      DIGEST_ARTIFACT_NAME: ${{ inputs.digest-artifact-name }}
      MEM_REQUEST: ${{ inputs.memory-request }}
      MEM_LIMIT: ${{ inputs.memory-limit }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Verify runner architecture
        run: '[ "$(uname -m)" = "aarch64" ] || { echo "must run on arm64"; exit 1; }'

      # ===== GitHub-hosted path (mode=buildx): native arm64 docker buildx =====
      - name: Checkout (buildx)
        if: env.MODE == 'buildx'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Buildx
        if: env.MODE == 'buildx'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 (node24 — GitHub forces node24 from 2026-06-16)

      - name: Login to Docker Hub (buildx)
        if: env.MODE == 'buildx'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2 (node24 — GitHub forces node24 from 2026-06-16)
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: Build & push (buildx)
        id: buildx
        if: env.MODE == 'buildx'
        env:
          GIT_TOKEN: ${{ github.token }}
          BUILD_ARGS_SECRET: ${{ secrets.build-args-secret }}
        run: |
          set -euo pipefail
          CTX_DIR="${CONTEXT_SUBDIR:-.}"
          # build-args (plain + sensitive) -> --build-arg flags (values no spaces)
          BA=()
          for kv in $BUILD_ARGS; do BA+=(--build-arg "$kv"); done
          for kv in ${BUILD_ARGS_SECRET:-}; do BA+=(--build-arg "$kv"); done
          TGT=()
          [ -n "${TARGET:-}" ] && TGT=(--target "$TARGET")
          # Mirror the in-cluster BuildKit secret so Dockerfiles that pull private
          # deps via id=GIT_AUTH_TOKEN keep working.
          echo "::add-mask::$GIT_TOKEN"
          printf '%s' "$GIT_TOKEN" > /tmp/git-token
          # --provenance=false: push a plain single-arch manifest, not an OCI
          # index. With the default provenance attestation buildx wraps even a
          # single platform in an index whose only child is arm64, which then
          # breaks tools that default to linux/amd64 (e.g. Trivy: "no child with
          # platform linux/amd64 in index"). This matches the old buildctl output.
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -f "${CTX_DIR%/}/$DOCKERFILE" \
            "${TGT[@]}" "${BA[@]}" \
            --secret id=GIT_AUTH_TOKEN,src=/tmp/git-token \
            --cache-from "type=registry,ref=${IMAGE}-cache" \
            --cache-to "type=registry,ref=${IMAGE}-cache,mode=min" \
            -t "${IMAGE}:${VERSION}" \
            --push \
            --metadata-file /tmp/bk-meta.json \
            "$CTX_DIR"
          rm -f /tmp/git-token
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/bk-meta.json)
          [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ] || { echo "no digest from buildx"; exit 1; }
          echo "Built ${IMAGE}:${VERSION} -> ${DIGEST}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ -n "${DIGEST_ARTIFACT_NAME:-}" ]; then
            printf '%s' "$DIGEST" > "${GITHUB_WORKSPACE}/${DIGEST_ARTIFACT_NAME}.txt"
          fi

      # ===== Self-hosted fallback path (mode=incluster): existing BuildKit pod =====
      - name: Setup kubectl
        if: env.MODE == 'incluster'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.31.0'

      - name: Configure kubeconfig via GitHub OIDC
        if: env.MODE == 'incluster'
        env:
          AUDIENCE: ${{ inputs.audience }}
          K8S_API_SERVER: ${{ inputs.k8s-api-server }}
          K8S_CA_DATA: ${{ inputs.k8s-ca-data }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSfL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "no OIDC token"; exit 1; }
          echo "::add-mask::$TOKEN"
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: c
            cluster:
              server: ${K8S_API_SERVER}
              certificate-authority-data: ${K8S_CA_DATA}
          users:
          - name: u
            user:
              token: ${TOKEN}
          contexts:
          - name: d
            context: { cluster: c, user: u, namespace: ${NS} }
          current-context: d
          EOF
          chmod 600 "$HOME/.kube/config"
          kubectl auth whoami

      - name: Build & push via BuildKit Pod
        id: run
        if: env.MODE == 'incluster'
        env:
          DH_USER: ${{ secrets.dockerhub-username }}
          DH_TOKEN: ${{ secrets.dockerhub-token }}
          GIT_TOKEN: ${{ github.token }}
          AUDIENCE: ${{ inputs.audience }}
          BUILD_ARGS_SECRET: ${{ secrets.build-args-secret }}
        run: |
          set -euo pipefail

          # OIDC-token refresh. The kubeconfig token from the previous step has
          # a ~few-minute TTL; a cold build can run >15min, after which every
          # `kubectl get pod` in the poll loop 401s, PHASE stays Unknown and the
          # loop runs to the 30min timeout even though the build long since
          # Succeeded. Refresh the kubeconfig user ("u") token every ~4min so the
          # poll (and the trap cleanup) keep a valid identity for the whole build.
          LAST_OIDC_REFRESH=$(date +%s)
          refresh_oidc() {
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && return 0
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && return 0
            local fresh
            fresh=$(curl -sSfL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" 2>/dev/null | jq -r '.value' 2>/dev/null) || return 0
            [ -z "$fresh" ] && return 0
            [ "$fresh" = "null" ] && return 0
            echo "::add-mask::$fresh"
            kubectl config set-credentials u --token="$fresh" >/dev/null 2>&1 || true
            LAST_OIDC_REFRESH=$(date +%s)
          }
          refresh_oidc_if_stale() {
            local now elapsed
            now=$(date +%s)
            elapsed=$((now - LAST_OIDC_REFRESH))
            [ $elapsed -lt 240 ] || refresh_oidc
          }

          # Name the pod/secret after the IMAGE basename, not the repo. Two
          # jobs in the SAME workflow run (e.g. agent + ibgw-totp) share REPO,
          # GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT — keying on the repo made both
          # compute the identical pod+secret name, so one job's "secret already
          # exists" failure tripped its trap cleanup, which deleted the shared-
          # named pod out from under the OTHER job's in-flight build. The image
          # basename is unique per build (wetrade vs wetrade-ibgw-totp).
          SAFE=$(printf '%s' "${IMAGE##*/}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | cut -c1-40)
          POD="buildkit-${SAFE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SECRET="bk-auth-${SAFE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            # Cleanup runs at the end of a possibly >15min step — the start
            # token is long expired, so force a refresh before the deletes or
            # they 401 and leak the pod+secret.
            refresh_oidc
            kubectl -n "$NS" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true
            kubectl -n "$NS" delete secret "$SECRET" --ignore-not-found --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # build-args -> "--opt build-arg:K=V ..." (values must not contain spaces)
          # Plain (public) args from the input + sensitive-valued args from the
          # masked build-args-secret. Both are baked into the image.
          BA=""
          for kv in $BUILD_ARGS; do BA="$BA --opt build-arg:$kv"; done
          for kv in ${BUILD_ARGS_SECRET:-}; do BA="$BA --opt build-arg:$kv"; done

          # Git build context. BuildKit clones the repo in-cluster; an optional
          # subdir (`#ref:subdir`) scopes the context root so a Dockerfile that
          # COPYs relative paths (e.g. tools/ib-gateway-totp) resolves correctly.
          CTX="https://github.com/${REPO}.git#${SHA}"
          [ -n "${CONTEXT_SUBDIR}" ] && CTX="${CTX}:${CONTEXT_SUBDIR}"

          # Optional multi-stage target (-> --opt target=<stage>).
          TGT=""
          [ -n "${TARGET:-}" ] && TGT=" --opt target=${TARGET}"

          # short-lived Secret: registry push-auth (config.json) + git clone token
          echo "::add-mask::$GIT_TOKEN"
          DCFG=$(printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$DH_USER" "$DH_TOKEN" | base64 -w0)")
          kubectl -n "$NS" create secret generic "$SECRET" \
            --from-literal=config.json="$DCFG" \
            --from-literal=git-token="$GIT_TOKEN" >/dev/null
          echo "Secret $SECRET created"

          # BuildKit build pod (rootless, validated admission-safe spec).
          # buildctl on a single line keeps the manifest free of escaping layers.
          # Cache export is mode=min, NOT max: on a memory-tight cluster the
          # mode=max export of every intermediate (SDK build) layer spiked the
          # build pod's memory during the export phase and pushed an ~85%-full
          # node into memory-pressure → TaintManager evicted pods and buildctl
          # exited non-zero AFTER the image had already pushed (run v1.0.292).
          # mode=min exports only the final image layers (already pushed), so the
          # export is near-free; the build-stage cache reuse it gives up is worth
          # not destabilising the node that also runs the trading workloads.
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD}
            namespace: ${NS}
            labels: { app: buildkit-build }
          spec:
            restartPolicy: Never
            nodeSelector: { kubernetes.io/arch: arm64 }
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile: { type: Unconfined }
              appArmorProfile: { type: Unconfined }
            volumes:
              - name: auth
                secret:
                  secretName: ${SECRET}
                  items:
                    - { key: config.json, path: config.json }
                    - { key: git-token, path: git-token }
            containers:
              - name: buildkit
                image: moby/buildkit@sha256:db7af72d1236f8b995cad4d0e5089327bbe349cccf42bb5de0b2f1e3a30106ff
                env:
                  - { name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox" }
                  - { name: DOCKER_CONFIG, value: "/home/user/.docker" }
                volumeMounts:
                  - { name: auth, mountPath: /home/user/.docker/config.json, subPath: config.json, readOnly: true }
                  - { name: auth, mountPath: /run/bk/git-token, subPath: git-token, readOnly: true }
                command: ["sh", "-c"]
                args:
                  - "buildctl-daemonless.sh build --frontend dockerfile.v0 --opt context=${CTX} --opt filename=${DOCKERFILE}${TGT}${BA} --secret id=GIT_AUTH_TOKEN,src=/run/bk/git-token --output type=image,name=${IMAGE}:${VERSION},push=true --export-cache type=registry,ref=${IMAGE}-cache,mode=min --import-cache type=registry,ref=${IMAGE}-cache"
                resources:
                  requests: { cpu: "500m", memory: "${MEM_REQUEST}" }
                  limits: { cpu: "2000m", memory: "${MEM_LIMIT}" }
          EOF

          # Wait for completion by POLLING the pod phase (no exec stream).
          echo "Waiting for build pod ${POD} (max ~30min)..."
          PHASE=Unknown
          for i in $(seq 1 360); do
            refresh_oidc_if_stale
            PHASE=$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || echo Unknown)
            case "$PHASE" in
              Succeeded) echo "Build pod Succeeded"; break ;;
              Failed)    echo "Build pod FAILED"; kubectl -n "$NS" logs "$POD" --tail=120 || true; exit 1 ;;
            esac
            sleep 5
          done
          [ "$PHASE" = "Succeeded" ] || { echo "Build pod did not finish (phase=$PHASE)"; kubectl -n "$NS" logs "$POD" --tail=120 || true; exit 1; }
          kubectl -n "$NS" logs "$POD" --tail=40 || true

          # Verify pushed tag + extract digest (read-after-write retry).
          echo "Verifying ${IMAGE}:${VERSION} in registry..."
          DIGEST=""
          for attempt in $(seq 1 8); do
            REG_TOKEN=$(curl -sfL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE}:pull" | jq -r '.token')
            HDR=$(curl -sfLI "https://index.docker.io/v2/${IMAGE}/manifests/${VERSION}" \
              -H "Authorization: Bearer ${REG_TOKEN}" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" 2>/dev/null || true)
            DIGEST=$(printf '%s' "$HDR" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/{print $2}' | tail -1)
            [ -n "$DIGEST" ] && { echo "Verified: digest=$DIGEST"; echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"; break; }
            [ "$attempt" -lt 8 ] && { echo "tag not visible yet, retry $attempt/8 in 15s"; sleep 15; }
          done
          [ -n "$DIGEST" ] || { echo "tag never appeared — push may have failed"; exit 1; }

          # Optionally persist the digest as an artifact for matrix callers whose
          # job outputs can't carry a per-leg value (see digest-artifact-name).
          [ -n "${DIGEST_ARTIFACT_NAME:-}" ] && printf '%s' "$DIGEST" > "${GITHUB_WORKSPACE}/${DIGEST_ARTIFACT_NAME}.txt" || true

      - name: Upload digest artifact
        if: inputs.digest-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.digest-artifact-name }}
          path: ${{ inputs.digest-artifact-name }}.txt
          retention-days: 7

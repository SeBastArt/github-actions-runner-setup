name: Trivy Scan (Runner Image)

# F-006 begleit-paket (AUDIT-2026-04-19).
# The ARC runner image is ghcr.io/actions/actions-runner, pinned in values/*.yaml.
# This workflow re-scans the pinned digest weekly so CVEs in the runner
# stack surface — runner pods have cluster-wide build authority, so
# compromised runner = compromised pipelines.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.70.0"
  RUNNER_IMAGE: "ghcr.io/actions/actions-runner@sha256:b57864c9fcda15ea4a270446aa9cfb108b819a26f6e71fc515f6caf6c27989c6"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          TMP="$(mktemp -d)"
          curl -sSfL -o "$TMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$TMP/trivy.tar.gz" -C "$TMP" trivy
          mv "$TMP/trivy" "$HOME/bin/trivy"
          chmod +x "$HOME/bin/trivy"
          rm -rf "$TMP"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Prime Trivy DB
        run: trivy image --download-db-only

      - name: Scan runner image
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --format table "$RUNNER_IMAGE"

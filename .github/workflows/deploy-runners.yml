name: Deploy GitHub Actions Runners

on:
  workflow_dispatch:
    inputs:
      runner_replicas:
        description: 'Number of runner replicas'
        required: true
        default: 4
        type: number
  # Kein push-Trigger: ein Runner-Deploy soll bewusst gestartet werden,
  # nicht automatisch bei jedem Workflow-File-Edit. Reine manuelle Kontrolle
  # via `gh workflow run` oder GitHub-UI.

env:
  HELM_VERSION: "3.13.0"
  # Using latest ARC version for best compatibility and features
  ARC_VERSION: "0.12.1"

# SECURITY: Restricted permissions
permissions:
  contents: read

jobs:
  deploy-arc:
    runs-on: ubuntu-latest  # SECURITY: Use GitHub-hosted runners for infrastructure deployment
    environment: production
    
    # SECURITY: Additional environment protection
    concurrency:
      group: deploy-arc-production
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        # Kubeconfig wird direkt als YAML in secrets.KUBECONFIG abgelegt
        # (konsistent mit den anderen 8 Workload-Workflows im Cluster).
        # Der frühere base64-Decode ist seit der F-001 Phase-2-Migration
        # überflüssig — manage-deploy-secrets.sh schreibt raw YAML.
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          # Verify connection
          kubectl auth whoami

      # cert-manager ist cluster-weite Infrastruktur und wird NICHT mehr
      # aus diesem Workflow installiert — der namespaced arc-runner-deployer
      # SA darf keine Secrets in cert-manager anfassen (F-001 Least-Privilege).
      # cert-manager läuft bereits im Cluster (einmalig manuell aufgesetzt).
      # Für IaC ist ein cluster-baseline/charts/cert-manager-Chart geplant,
      # aktuell ist das aber out-of-scope. Check manuell:
      #   kubectl get pods -n cert-manager

      - name: Clean up old repository-level runners
        run: |
          # Remove ALL old installations (different naming conventions)
          helm uninstall arm64-runners --namespace actions-runner-system || echo "No old arm64-runners found"
          helm uninstall org-arm64-runners --namespace actions-runner-system || echo "No old org-arm64-runners found"
          
          # Wait for cleanup
          sleep 10
          
          # Clean up old resources and remove finalizers if stuck
          kubectl patch autoscalingrunnerset arm64-runners -n actions-runner-system \
            --type=merge -p '{"metadata":{"finalizers":null}}' || echo "No old AutoscalingRunnerSet arm64-runners found"
          kubectl patch autoscalingrunnerset org-arm64-runners -n actions-runner-system \
            --type=merge -p '{"metadata":{"finalizers":null}}' || echo "No old AutoscalingRunnerSet org-arm64-runners found"
          
          kubectl delete autoscalingrunnerset arm64-runners -n actions-runner-system || echo "No old AutoscalingRunnerSet arm64-runners found"
          kubectl delete autoscalingrunnerset org-arm64-runners -n actions-runner-system || echo "No old AutoscalingRunnerSet org-arm64-runners found"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      # Der ARC-Controller (gha-runner-scale-set-controller Chart) erzeugt
      # cluster-scoped ClusterRoles+ClusterRoleBindings und ist damit NICHT
      # mehr von diesem Workflow verwaltbar — der namespaced arc-runner-deployer
      # SA darf keine ClusterRoles anfassen (F-001 Least-Privilege).
      # Der Controller läuft bereits seit 2025-07-30 im Cluster; Upgrades
      # müssen manuell mit cluster-admin oder über ein zukünftiges
      # cluster-baseline/charts/arc-controller-Chart erfolgen. Aktueller
      # Check:
      #   kubectl get deploy -n actions-runner-system arc-gha-rs-controller

      - name: Deploy Runner Scale Set (Production)
        run: |
          # Deploy production runners with configurable count using values files
          # WITH Docker-in-Docker for container builds
          # Kein --create-namespace: der NS actions-runner-system existiert
          # bereits (seit dem ARC-Controller-Install). Helm fragt den
          # Namespaces-Endpoint trotzdem cluster-scoped an (create-verb),
          # was der namespaced arc-runner-deployer nicht darf.
          helm upgrade --install arm64-runners \
            --namespace actions-runner-system \
            --values ./values/base.yaml \
            --values ./values/production.yaml \
            --set githubConfigSecret.github_token="${{ secrets.TOKEN }}" \
            --set githubConfigUrl="${{ secrets.CONFIG_URL || 'https://github.com/wondering-developer' }}" \
            --set minRunners=1 \
            --set maxRunners=${{ github.event.inputs.runner_replicas || 10 }} \
            --wait \
            --timeout=10m \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

      - name: Verify deployment
        run: |
          echo "🔍 Checking ARC Controller status..."
          kubectl get pods -n actions-runner-system
          
          echo "📊 Checking AutoscalingRunnerSet (ARC v0.12+ API)..."
          kubectl get autoscalingrunnerset -n actions-runner-system -o wide || echo "No AutoscalingRunnerSet found yet"
          
          echo "🎯 CRITICAL: Checking Runner Installation Name (NEW targeting method)..."
          kubectl get autoscalingrunnerset arm64-runners -n actions-runner-system -o jsonpath='{.metadata.name}' || echo "arm64-runners installation not found"
          echo ""
          echo "Installation details:"
          kubectl get autoscalingrunnerset arm64-runners -n actions-runner-system -o yaml | grep -E "name:|runnerScaleSetName:" || echo "Installation details not available"
          
          echo "🏗️ Automatic Labels (ARC v0.12+ generates these based on runtime):"
          echo "  - self-hosted (automatic)"
          echo "  - linux (from OS detection)"
          echo "  - ARM64 (from nodeSelector: kubernetes.io/arch=arm64)"
          echo "  - arm64-runners (installation name for targeting)"
          
          echo "🔍 Checking EphemeralRunnerSet..."
          kubectl get ephemeralrunnerset -n actions-runner-system || echo "No EphemeralRunnerSet found yet"
          
          echo "📋 Checking Helm release status..."
          helm status arm64-runners -n actions-runner-system
          
          echo "📋 Checking Helm values (no runnerLabels in v0.12+)..."
          helm get values arm64-runners -n actions-runner-system
          
          echo "🔧 Checking all custom resources..."
          kubectl api-resources | grep actions || echo "ARC CRDs not found"
          
          echo "📝 Checking recent events for any issues..."
          kubectl get events -n actions-runner-system --sort-by='.lastTimestamp' | tail -10
          
          echo "⚡ Waiting for runner pods to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=gha-runner-scale-set -n actions-runner-system --timeout=300s || echo "Timeout waiting for runner pods"

      - name: Run setup verification
        run: |
          chmod +x ./scripts/verify-setup.sh
          ./scripts/verify-setup.sh

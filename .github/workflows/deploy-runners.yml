name: Deploy GitHub Actions Runners

# Serialize deploys per-repo; GHA concurrency is repo-scoped, so this only
# gates intra-repo stacking. Cross-repo burst schuetzt der Kaniko-Wait-Bump.
concurrency:
  group: cluster-deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      runner_replicas:
        # 2026-10-04: Default 4 -> 1. Gilt nur fuer das GROSSE Set (1Gi/Pod).
        # Auf node-13 passt real genau ein 1Gi-Runner; jeder weitere wurde ein
        # Pending-Pod, der den worker-headroom-Balloon blockiert (HoneyPal-CI
        # 37194906313: 5 Pods, 4 Pending). Mit 1 warten weitere Jobs in der
        # GitHub-Queue statt im Cluster. Steuer-Jobs laufen auf dem kleinen Set.
        # 2026-11-21: Default 1 -> 2. node-13 hat seit dem Abbau von WeTrade
        # (10-22) und dem Parken von weplan (10-31) Luft: 69 % Memory-Requests
        # mit einem laufenden Runner, mit zweien ~77 %. Mit 1 stauten sich CI
        # und Deploys ueber alle Repos seriell (Renovate-Welle 11-21). Wenn
        # wieder Runner-Pods Pending bleiben: zurueck auf 1.
        # 2026-11-23: Default 2 -> 1. Genau das trat ein: nach dem kured-WE 11-22
        # war node-13 request-seitig voll, Runner und BuildKit-Pods (768Mi je
        # Build, ebenfalls nodepool=worker) blieben am 11-23 06:02-12:24 UTC
        # Pending, zwei weatherstation-Push-Laeufe scheiterten. Zwei parallele
        # Builds brauchen 2 x (1Gi + 768Mi) = 3,6Gi, so viel ist dort nicht frei.
        description: 'maxRunners des grossen Sets production-arm64 (1Gi/Pod)'
        required: true
        default: 1
        type: number
  # Kein push-Trigger: ein Runner-Deploy soll bewusst gestartet werden,
  # nicht automatisch bei jedem Workflow-File-Edit. Reine manuelle Kontrolle
  # via `gh workflow run` oder GitHub-UI.

env:
  # 2026-11-21: 3.13.0 -> 3.17.3. Seit der `helm registry login` (mit dem
  # PAT) raus ist, zieht Helm die oeffentlichen ARC-Charts anonym. 3.13.0
  # haengt dabei einen falschen Scope `repository:user/image:pull` an die
  # Token-Anfrage, ghcr.io antwortet 403 (Run 44895377851). 3.17.3 ist die
  # Version, mit der Pull und `helm template` beider Sets lokal verifiziert sind.
  HELM_VERSION: "3.17.3"
  # Muss zu der Version des ARC-Controllers passen, der cluster-weit läuft
  # (gha-runner-scale-set-controller 0.13.1). Ohne --version holt Helm die
  # latest aus ghcr.io, aktuell 0.14.1 — der 0.13.1 Controller löscht dann
  # den 0.14.1 Scale-Set sofort mit "Autoscaling runner set version doesn't
  # match the build version". Upgrade des Controllers braucht cluster-admin.
  ARC_VERSION: "0.13.1"
  # 2026-11: Controller, Listener und Scale-Sets liegen in arc-system, getrennt
  # von den Image-Builds in actions-runner-system (Begruendung:
  # cluster-baseline/charts/arc-controller/README.md §Namespace-Schnitt).
  ARC_NAMESPACE: arc-system

# SECURITY: Restricted permissions
permissions:
  contents: read
  # F-004: OIDC gegen k3s-apiserver, User `gha:repo:SeBastArt/github-actions-runner-setup:ref:refs/heads/<branch>`.
  id-token: write

jobs:
  deploy-arc:
    runs-on: ubuntu-latest  # SECURITY: Use GitHub-hosted runners for infrastructure deployment
    environment: production
    
    # SECURITY: Additional environment protection
    concurrency:
      group: deploy-arc-production
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: 'v1.37.2'

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure Kubeconfig via GitHub Actions OIDC
        # F-004: kurzlebiges JWT von GitHubs OIDC-Issuer, kein secrets.KUBECONFIG
        # mehr. Der User-Subject wird vom cluster-baseline/charts/deploy-roles
        # Chart gemanaged: `gha:repo:SeBastArt/github-actions-runner-setup:ref:refs/heads/master`.
        env:
          AUDIENCE: https://kubernetes.wetrade.cluster.local
          K8S_API_SERVER: ${{ vars.K8S_API_SERVER }}
          K8S_CA_DATA: ${{ vars.K8S_CA_DATA }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSfL \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to obtain GitHub OIDC token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: cluster
            cluster:
              server: ${K8S_API_SERVER}
              certificate-authority-data: ${K8S_CA_DATA}
          users:
          - name: gha-oidc
            user:
              token: ${TOKEN}
          contexts:
          - name: default
            context:
              cluster: cluster
              user: gha-oidc
          current-context: default
          EOF
          chmod 600 "$HOME/.kube/config"
          kubectl auth whoami

      # cert-manager ist cluster-weite Infrastruktur und wird NICHT mehr
      # aus diesem Workflow installiert — der namespaced arc-runner-deployer
      # SA darf keine Secrets in cert-manager anfassen (F-001 Least-Privilege).
      # cert-manager läuft bereits im Cluster (einmalig manuell aufgesetzt).
      # Für IaC ist ein cluster-baseline/charts/cert-manager-Chart geplant,
      # aktuell ist das aber out-of-scope. Check manuell:
      #   kubectl get pods -n cert-manager

      # 2026-11: Uninstall-/Finalizer-Zyklus und `helm registry login` entfernt.
      # - Der Uninstall-Zyklus stammte aus der Zeit der Release-Umbenennung
      #   (arm64-runners -> production-arm64) und hat bei JEDEM Deploy das
      #   grosse Set abgeschossen. Seit dem Umzug nach arc-system gibt es keine
      #   Altlasten mit kollidierendem Namen mehr; `helm upgrade --install`
      #   reicht. Der einmalige Umzug lief manuell mit cluster-admin
      #   (cluster-baseline/charts/arc-controller/README.md §Umzug).
      # - Die ARC-OCI-Charts sind oeffentlich, der Pull geht anonym. Der Login
      #   lief mit secrets.TOKEN (dem abgelaufenen PAT) und waere nach dessen
      #   Loeschung der erste Bruch gewesen.

      # GitHub-App-Credentials -> Secret arc-github-auth in arc-system.
      # Quelle: Environment-Secrets (production) dieses Repos. Bewusst NICHT
      # aus Bitwarden: der einzige freie Bitwarden-Token (sm-longhorn) liest das
      # ganze Projekt cluster-infra und muesste dafuer in arc-system liegen, wo
      # dieser Deployer Secrets lesen darf. Ein App-Key laeuft nicht ab — das
      # Problem, das der PAT hatte (jaehrlicher Ablauf), loest die App selbst.
      #
      # Server-side apply: keine last-applied-Annotation mit dem Key darin.
      # Werte gehen ueber Dateien in $RUNNER_TEMP (umask 077), nicht ueber die
      # Kommandozeile (waeren sonst in der Prozessliste sichtbar).
      #
      # Der Listener liest die Credentials nur beim Start: der Controller
      # kopiert sie in <set>-<hash>-listener-config und verwendet ein
      # vorhandenes Config-Secret wieder; kein Controller beobachtet Secrets.
      # Bei einer Rotation wird deshalb die AutoscalingListener-CR geloescht
      # (nicht nur der Pod — der behielte die alte Config); das ARS legt sie
      # mit den neuen Werten neu an. Das passiert HIER im selben Schritt, nicht
      # in einem spaeteren: bricht der Lauf danach ab (z. B. helm upgrade),
      # saehe der naechste Lauf before == after und wuerde nie neu starten.
      - name: Sync GitHub App credentials
        env:
          APP_ID: ${{ secrets.ARC_GITHUB_APP_ID }}
          APP_INSTALLATION_ID: ${{ secrets.ARC_GITHUB_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ARC_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in APP_ID APP_INSTALLATION_ID APP_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment-Secret fuer $v fehlt (ARC_GITHUB_APP_*)"
              exit 1
            fi
          done
          # App-ID: numerische ID oder Client-ID (Iv...); ARC fuehrt sie als
          # String. Installation-ID parst ARC mit ParseInt -> nur Ziffern.
          case "$APP_ID" in
            *[!A-Za-z0-9]*) echo "::error::ARC_GITHUB_APP_ID: nur Buchstaben/Ziffern erwartet"; exit 1 ;;
          esac
          case "$APP_INSTALLATION_ID" in
            *[!0-9]*) echo "::error::ARC_GITHUB_APP_INSTALLATION_ID muss numerisch sein"; exit 1 ;;
          esac
          if ! printf '%s' "$APP_PRIVATE_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::ARC_GITHUB_APP_PRIVATE_KEY ist kein PEM-Key"
            exit 1
          fi
          umask 077
          d="$(mktemp -d "$RUNNER_TEMP/arc-auth.XXXXXX")"
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$APP_ID" > "$d/github_app_id"
          printf '%s' "$APP_INSTALLATION_ID" > "$d/github_app_installation_id"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$d/github_app_private_key"
          # Nur eine ROTATION (Secret existierte schon, Inhalt anders) startet
          # die Listener neu; beim Erst-Anlegen gibt es noch keine.
          before=""
          if kubectl get secret arc-github-auth -n "$ARC_NAMESPACE" >/dev/null 2>&1; then
            before="$(kubectl get secret arc-github-auth -n "$ARC_NAMESPACE" \
              -o jsonpath='{.data}' | sha256sum)"
          fi
          kubectl create secret generic arc-github-auth -n "$ARC_NAMESPACE" \
            --from-file="$d/github_app_id" \
            --from-file="$d/github_app_installation_id" \
            --from-file="$d/github_app_private_key" \
            --dry-run=client -o yaml \
            | kubectl apply --server-side --field-manager=deploy-runners --force-conflicts -f - >/dev/null
          after="$(kubectl get secret arc-github-auth -n "$ARC_NAMESPACE" \
            -o jsonpath='{.data}' | sha256sum)"
          if [ -z "$before" ]; then
            echo "Secret arc-github-auth neu angelegt."
          elif [ "$before" != "$after" ]; then
            echo "Secret arc-github-auth rotiert, Listener werden neu gestartet."
            kubectl delete autoscalinglistener --all -n "$ARC_NAMESPACE" --wait=false
          else
            echo "Secret arc-github-auth unveraendert."
          fi

      - name: Deploy Runner Scale Set (Production)
        run: |
          # minRunners steht allein in values/production.yaml (ein --set
          # schluege jede Values-Datei). maxRunners MUSS --set-json sein, nicht
          # --set: das Chart vergleicht `gt .Values.minRunners .Values.maxRunners`,
          # --set liefert int64, die Values-Datei float64 -> "incompatible types
          # for comparison" (2026-09-07). Der Fehler tritt erst beim Rendern
          # auf, also NACHDEM helm die bestehende Release angefasst hat — vor
          # Aenderungen an den Werten immer erst `helm template` lokal fahren.
          # githubConfigSecret steht als String-Verweis in values/base.yaml
          # (arc-github-auth); der Chart rendert dann kein eigenes Secret und
          # der Key landet nicht in den Helm-Release-Values.
          helm upgrade --install arm64-runners \
            --namespace "$ARC_NAMESPACE" \
            --version ${{ env.ARC_VERSION }} \
            --values ./values/base.yaml \
            --values ./values/production.yaml \
            --set githubConfigUrl="${{ secrets.CONFIG_URL || 'https://github.com/wondering-developer' }}" \
            --set-json maxRunners=${{ github.event.inputs.runner_replicas || 1 }} \
            --wait \
            --timeout=10m \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

      # 2026-10-04: zweite Runner-Klasse fuer Steuer-Jobs (prepare/sign/deploy),
      # 256Mi statt 1Gi Request — Plan in cluster-baseline/runner.md.
      # Bewusst OHNE --set-json maxRunners: der Input `runner_replicas` gilt
      # nur fuer das grosse Set, maxRunners steht in production-small.yaml.
      - name: Deploy Runner Scale Set (Production, small)
        run: |
          helm upgrade --install arm64-runners-small \
            --namespace "$ARC_NAMESPACE" \
            --version ${{ env.ARC_VERSION }} \
            --values ./values/base.yaml \
            --values ./values/production-small.yaml \
            --set githubConfigUrl="${{ secrets.CONFIG_URL || 'https://github.com/wondering-developer' }}" \
            --wait \
            --timeout=10m \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

      # Harte Pruefung: Scale-Set muss existieren UND der Listener stabil
      # laufen (Listener leben im Controller-NS, seit 2026-11 ebenfalls
      # arc-system). Die zweite Pruefung nach 30 s faengt einen Listener ab,
      # der kurz "Running" zeigt, aber im 401-Crashloop haengt.
      - name: Assert scale sets and listeners are up
        run: |
          set -euo pipefail
          listener_running() {
            kubectl get pods -n "$ARC_NAMESPACE" --no-headers \
              | grep -E "^${1}-[a-z0-9]+-listener " | grep -q ' Running '
          }
          check() {
            local set="$1"
            for i in $(seq 1 24); do
              sleep 10
              # Listener-Name: <scaleset>-<hash>-listener. Der Hash-Teil
              # enthaelt keinen Bindestrich, deshalb matcht `production-arm64-`
              # NICHT den Listener von `production-arm64-small`.
              if kubectl get autoscalingrunnerset "$set" -n "$ARC_NAMESPACE" >/dev/null 2>&1 \
                 && listener_running "$set"; then
                sleep 30
                if listener_running "$set"; then
                  kubectl get autoscalingrunnerset "$set" -n "$ARC_NAMESPACE"
                  echo "Scale-Set $set + Listener laufen."
                  return 0
                fi
              fi
            done
            echo "::error::Scale-Set $set oder Listener nach 240s nicht stabil"
            kubectl get autoscalingrunnerset,autoscalinglistener,pods -n "$ARC_NAMESPACE" || true
            kubectl logs -n "$ARC_NAMESPACE" -l app.kubernetes.io/component=runner-scale-set-listener --tail=20 || true
            return 1
          }
          check production-arm64
          check production-arm64-small

      - name: Verify deployment
        run: |
          kubectl get autoscalingrunnerset,autoscalinglistener,ephemeralrunnerset -n "$ARC_NAMESPACE" -o wide || true
          kubectl get pods -n "$ARC_NAMESPACE" || true
          helm status arm64-runners -n "$ARC_NAMESPACE" || true
          helm status arm64-runners-small -n "$ARC_NAMESPACE" || true
          kubectl get events -n "$ARC_NAMESPACE" --sort-by='.lastTimestamp' | tail -15 || true

      # verify-setup.sh entfernt: der namespaced arc-runner-deployer darf
      # keine cluster-scoped Queries (kubectl cluster-info, api-resources,
      # get nodes) absetzen.

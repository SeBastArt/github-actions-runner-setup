version: 2

# F-006 begleit-paket (AUDIT-2026-04-19).
# runner-setup deploys the ARC scale-set via the upstream Helm chart;
# digest pins live in values/*.yaml (base + production). Dependabot tracks
# GitHub Actions workflow-level deps here.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

# Base values for GitHub Actions Runner Scale Set (OCI Chart)
# For use with: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

# GitHub configuration (set via --set in workflow)
githubConfigUrl: ""
githubConfigSecret:
  github_token: ""

# Expliziter Verweis auf den bestehenden ARC-Controller-SA — ohne diesen
# Block rendert der Chart mit `lookup "apps/v1" "Deployment" "" ""` und
# braucht cluster-scoped "list deployments"-Rechte, die der namespaced
# arc-runner-deployer nicht hat (F-001 Least-Privilege).
controllerServiceAccount:
  namespace: actions-runner-system
  name: arc-gha-rs-controller

# Runner Scale Set name
runnerScaleSetName: "arm64-runners"

# Scaling configuration
minRunners: 0
maxRunners: 5

# F-002: Container-Modus auf Kubernetes umgestellt, um den privilegierten
# DinD-Sidecar zu eliminieren. Der Runner scheduled workflow-Job-Container
# jetzt als separate K8s-Pods via API statt einen Docker-Daemon lokal zu
# fahren. Konsequenz fuer Build-Steps: `docker build` funktioniert nicht
# mehr, weil kein lokaler Docker-Daemon existiert — die Workflows nutzen
# Kaniko (`gcr.io/kaniko-project/executor`) fuer Image-Builds.
#
# Das `kubernetesModeWorkVolumeClaim` definiert den kurzlebigen Workspace-
# PVC, den jeder Runner-Pod fuer `/home/runner/_work` mountet. `local-path`
# statt longhorn, weil der Workspace wirklich ephemeral ist (loescht mit
# dem Runner-Pod am Job-Ende) — kein Sinn, ihn ueber Longhorn-Replicas zu
# verteilen.
containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 2Gi

# ARM64 node selector and container image
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    containers:
    - name: runner
      # F-006 (AUDIT-2026-04-19): digest-pinned. See production.yaml for the
      # resolution procedure. Bump in lockstep with production.yaml.
      image: ghcr.io/actions/actions-runner:latest@sha256:b6614fce332517f74d0a76e7c762fb08e4f2ff13dcf333183397c8a5725b6e8e
      imagePullPolicy: IfNotPresent
      command: ["/home/runner/run.sh"]
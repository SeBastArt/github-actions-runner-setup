# Base values for GitHub Actions Runner Scale Set (OCI Chart)
# For use with: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

# GitHub configuration (set via --set in workflow)
githubConfigUrl: ""
githubConfigSecret:
  github_token: ""

# Expliziter Verweis auf den bestehenden ARC-Controller-SA — ohne diesen
# Block rendert der Chart mit `lookup "apps/v1" "Deployment" "" ""` und
# braucht cluster-scoped "list deployments"-Rechte, die der namespaced
# arc-runner-deployer nicht hat (F-001 Least-Privilege).
controllerServiceAccount:
  namespace: actions-runner-system
  name: arc-gha-rs-controller

# Runner Scale Set name
runnerScaleSetName: "arm64-runners"

# Scaling configuration
minRunners: 0
maxRunners: 5

# AUDIT 2026-04-26 TOP-09 Phase 2: Wechsel von containerMode.type=kubernetes
# auf default (leerer string). Hintergrund: K8s-Mode laesst den ARC-Chart
# eine Role `production-arm64-gha-rs-kube-mode` rendern mit `pods/exec` +
# `secrets create/get/list/delete` an die Runner-SA — d. h. ein
# Runner-Compromise (Tag-Mover, boese Workflow-Action) konnte andere
# Runner-Jobs hijacken oder Secrets im Runner-NS umschreiben.
#
# Voraussetzung fuer den Wechsel: keine Workflows nutzen `container:`-Spec
# (verifiziert via grep ueber alle aktiven Workflows). Kaniko-Builds laufen
# weiterhin als separate K8s-Pods (von der Workflow gestartet), nicht ueber
# das Runner-Kube-Mode-Hook. Helm-Deploy-Workflows laufen im Runner-Pod
# (klassischer Mode).
#
# Frueheres `kubernetesModeWorkVolumeClaim` (Workspace-PVC) entfaellt mit
# dem Mode-Switch — die Workspace-Files leben jetzt im emptyDir des
# Runner-Pods, was bei kurzlebigen Runs ohnehin das richtige Modell ist.
containerMode:
  type: ""

# ARM64 node selector and container image
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    # AUDIT 2026-04-26 TOP-09 Phase 2: PSS-baseline-konformer Pod-Level-
    # securityContext. runAsUser 1001 entspricht dem `runner`-User im
    # actions-runner-Image (Upstream-Default). seccompProfile RuntimeDefault
    # blockt eine Reihe Container-Escape-Syscalls (mount, ptrace, kexec).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
    - name: runner
      # F-006 (AUDIT-2026-04-19): digest-pinned. See production.yaml for the
      # resolution procedure. Bump in lockstep with production.yaml.
      image: ghcr.io/actions/actions-runner:latest@sha256:ccdcb5f6ad3ff02cda20d47544b9bc335b9d555b535fb3556da83e823652a8b4
      imagePullPolicy: IfNotPresent
      command: ["/home/runner/run.sh"]
      # AUDIT 2026-04-26 TOP-09 Phase 2: Container-Level-Hardening.
      # Caps:[ALL]-Drop ist sicher, weil der Runner als Code-Ausfuehrer
      # keine Linux-Capabilities braucht — Workflows laufen im selben
      # Pod oder spawnen separate Build-Pods (Kaniko) ohne Cap-Bedarf.
      # ROFS bewusst NICHT gesetzt — der Runner muss /home/runner/_work,
      # /tmp und Cache-Verzeichnisse beschreiben.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
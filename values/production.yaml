# Production environment overrides for OCI Chart
# Only contains differences from base.yaml configuration

# Production runner scale set name
runnerScaleSetName: "production-arm64"

# Higher scaling limits for production
# 2026-08-26: minRunners 1 -> 0. Builds laufen regulaer auf GitHub-hosted
# Runnern; dieses Scale-Set ist nur noch Fallback, wenn das Billing-Budget
# erschoepft ist (siehe GH_BILLING_TOKEN-Pfad in den Build-Workflows).
# Ein warmer Standby-Runner kostete dauerhaft 1Gi Memory-Request auf node-13,
# dem einzigen Node mit `nodepool: worker` — gemessen 93,3 % Request-Buchung
# bei nur 68,8 % echter RAM-Nutzung, und der worker-headroom-Balloon passte
# nicht mehr drauf (Pending). Der Standby-Runner selbst hat in 14 Tagen real
# 6 MiB benutzt. Kosten von minRunners=0: ~30 s Anlaufzeit beim seltenen
# Fallback-Build (scale-from-zero).
minRunners: 0
maxRunners: 10

# Production template overrides
template:
  spec:
    # ARM64 node selector (from base.yaml)
    # 2026-06-11: zusaetzlich nodepool=worker — Runner (und die separat
    # gescheduleten kaniko-Build-Pods, s. cluster-baseline kyverno-policy
    # pin-kaniko-builds-to-worker) laufen NUR auf dem dedizierten Worker-Node
    # (kein etcd), damit Build-I/O nie die geteilte Disk-Queue saettigt und
    # etcd-fsync stallt -> API-Flap. Worker = node-13 (k3s agent, Label
    # nodepool=worker). NICHT in base.yaml, weil Test-Runner keinen solchen
    # Node haben (sonst FailedScheduling).
    nodeSelector:
      kubernetes.io/arch: arm64
      nodepool: worker
      
    # Higher resource limits and production env vars
    containers:
    - name: runner
      # F-006 (AUDIT-2026-04-19): digest-pin the ARC runner image. `:latest`
      # from `ghcr.io/actions/*` is an attractive tag-mover target — a
      # compromised GitHub push-token could seed the cluster with backdoored
      # runners. Pin the resolved digest; bump the digest together with
      # upstream security advisories (Dependabot/Renovate-driven).
      # Digest resolved 2026-04-20 via:
      #   curl -I -H "Authorization: Bearer $(curl -sfL \
      #     'https://ghcr.io/token?scope=repository:actions/actions-runner:pull' \
      #     | python -c 'import json,sys;print(json.load(sys.stdin)["token"])')" \
      #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
      #     https://ghcr.io/v2/actions/actions-runner/manifests/latest
      # 2026-07-02: eigenes derived Image (runner-image/Dockerfile: upstream
      # actions-runner + gettext-base/envsubst fuer cosign-installer v4).
      # Upstream-Base-Digest bleibt im Dockerfile gepinnt; dieses Image via
      # build-runner-image.yaml bauen und hier den neuen Digest pinnen.
      image: ghcr.io/sebastart/actions-runner:latest@sha256:6ba8b517474286973271a9c0098602b38a21e1768c478a6173789abf43ffcba8
      imagePullPolicy: IfNotPresent
      command: ["/home/runner/run.sh"]
      # AUDIT 2026-04-26 TOP-09 Phase 2: Container-Level-Hardening, Doppelung
      # zu base.yaml notwendig weil Helm-Values bei `containers` (List) den
      # Eintrag aus production.yaml die base.yaml-Liste komplett ueberschreibt
      # (kein Merge auf List-Items). Pod-Level securityContext aus base.yaml
      # bleibt aktiv (template.spec.securityContext ist eine Map und mergt).
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      # F-002 follow-up: 2Gi-Request war zu aggressiv fuer concurrent runs,
      # 5 parallele Jobs konnten nicht eingelastet werden (FailedScheduling).
      # 1Gi reicht fuer den Runner-Prozess + evtl. kubectl-exec-Overhead;
      # die Build-Pods selbst werden separat scheduled (K8s-Mode-Pattern).
      resources:
        requests:
          cpu: "250m"
          memory: "1Gi"
        limits:
          cpu: "4000m"
          memory: "4Gi"

      env:
      - name: BUILDX_EXPERIMENTAL
        value: "1"
      - name: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      # F-002: K8s-Mode-Runner blockiert per Default alle Jobs ohne explizites
      # `container:`-Spec. Dieser Flag erlaubt klassische Jobs, die direkt im
      # Runner-Pod laufen (wie vor der K8s-Mode-Umstellung). Nötig fuer die
      # Helm-Deploy-only-Workflows (kubecloud, telemetry-*, arc-runner) und
      # fuer die Docker-Workflows während der schrittweisen Kaniko-Migration.
      # Sicherheitsseitig unkritisch, weil der Runner selbst unprivileged
      # läuft und der DinD-Sidecar weg ist — der Flag ändert nur die Job-
      # Dispatch-Policy, nicht die Privilegien.
      - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
        value: "false"